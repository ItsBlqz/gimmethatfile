[package]
name = "gtf-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Segmented, resumable HTTP download engine"
keywords = ["download", "http", "segmented", "resume", "accelerator"]
categories = ["network-programming"]
publish = false

[dependencies]
anyhow = "1"
dirs = "5"
parking_lot = "0.12"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
