[package]
name = "vdl-engine"
version = "0.1.0"
edition = "2021"
description = "Segmented, resumable HTTP download engine"

[dependencies]
anyhow = "1"
dirs = "5"
parking_lot = "0.12"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
