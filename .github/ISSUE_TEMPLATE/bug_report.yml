name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **don't paste private, signed or paid links**; describe the server instead (e.g. "Google Drive", "a CDN returning 403 on the 3rd connection").
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the error message shown in the app, if any.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a link from ...
        2. Pause after ...
        3. ...
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: logs
    attributes:
      label: Debug log (optional but very helpful)
      description: |
        Run the CLI with logging, then paste the output:
        `VDL_DEBUG=1 cargo run --release -p vdl-engine --example get -- <url> 8 ./out`
      render: text
