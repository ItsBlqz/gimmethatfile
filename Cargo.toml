[workspace]
resolver = "2"
members = ["crates/engine", "app"]

# Shared by every crate. Bump `version` here to release (see CONTRIBUTING.md).
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ItsBlqz/vibe-downloader"
rust-version = "1.90"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
